[project]
name = "claude-mcp-server"
version = "0.1.0"
description = "MCP server for managing GitHub repositories via Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "PyGithub>=2.1.1",
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
claude-mcp = "src.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
